      - heading "为什么要去官网投简历？" [level=3] [ref=e9950]
    - generic [ref=e9951]:
      - paragraph [ref=e9954]: 我也知道官网投简历麻烦啊！但我做了11年校招，前Top3校招平台联合创始人，专门与各求职平台打交道。
      - paragraph [ref=e9955]: 有些平台虚假招聘，用热门公司（大厂/爱豆/时事热点）骗你注册，简历根本没投递；有些是利用人性懒惰，说用报名表就能投递，一律是骗你信息，然后加微信卖课；有些是替你投邮箱，而企业SaaS的简历解析真实成功率仅86%，有14%就白投（别问我为什么知道）；就算解析成功，但解丢了你的硕士教育经历，简历筛选硕士学历就自动pass了；绝大多数大厂只支持官网投递，稍有良心的平台最后还是会“邀请”你去官网再投一遍...
      - paragraph [ref=e9956]: 只有！只有企业招聘官网，能100%确保让HR看到完整的你！怪不得以前投简历都石沉大海是吧？
      - paragraph [ref=e9957]: 求职行业乱象太严重，作为工科男我忍无可忍，自己手搓求职方舟，能救一个是一个吧！
      - generic [ref=e9958]: —— 小风学长