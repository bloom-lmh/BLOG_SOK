<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">MyBatis 查询执行链路</title>
  <desc id="desc">从 Mapper 方法调用，经动态代理、MappedStatement、SqlSession、二级缓存、一级缓存、数据库查询和结果映射后返回业务对象。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <linearGradient id="business" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2457d6"/>
      <stop offset="1" stop-color="#6947d9"/>
    </linearGradient>
    <linearGradient id="framework" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16385c"/>
      <stop offset="1" stop-color="#132b4b"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77461d"/>
      <stop offset="1" stop-color="#50311d"/>
    </linearGradient>
    <linearGradient id="query" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d4e"/>
      <stop offset="1" stop-color="#102d40"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#62d9ff"/>
    </marker>
    <marker id="returnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#78e6a6"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #f1f7ff; letter-spacing: 2px; }
      .subtitle { font-size: 20px; fill: #8ca6c9; }
      .lane { font-size: 21px; font-weight: 700; fill: #89a6cf; letter-spacing: 2px; }
      .card-title { font-size: 24px; font-weight: 700; fill: #f5f9ff; }
      .card-sub { font-size: 17px; fill: #a9bdd8; }
      .code { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 21px; fill: #dcecff; }
      .step { font-size: 18px; fill: #dbe9fb; }
      .small { font-size: 15px; fill: #92aac7; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 16px; fill: #a9bdd8; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1470" cy="80" r="240" fill="#1b4fa7" opacity="0.10"/>
  <circle cx="120" cy="1050" r="270" fill="#6134c8" opacity="0.09"/>
  <path d="M0 142 H1600" stroke="#28415f" stroke-width="1"/>

  <g class="font">
    <text x="70" y="70" class="title">MyBatis 查询执行链路</text>
    <text x="72" y="108" class="subtitle">从 Mapper 方法调用，到缓存判断、JDBC 执行与结果映射</text>

    <text x="86" y="185" class="lane">业务代码</text>
    <text x="550" y="185" class="lane">MYBATIS 框架内部</text>
    <rect x="70" y="205" width="390" height="760" rx="28" fill="#09172b" stroke="#233c5d" stroke-width="2"/>
    <rect x="500" y="205" width="1030" height="760" rx="28" fill="#0a1629" stroke="#233c5d" stroke-width="2"/>

    <!-- Business call -->
    <g filter="url(#shadow)">
      <rect x="100" y="270" width="330" height="115" rx="20" fill="url(#business)" stroke="#7ea7ff" stroke-width="1.5"/>
      <text x="125" y="312" class="card-sub" fill="#dbe8ff">Mapper 方法调用</text>
      <text x="125" y="352" class="code">mapper.getById(1L)</text>
    </g>

    <path d="M265 385 V450" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="280" y="425" class="small">JDK 动态代理拦截</text>

    <g filter="url(#shadow)">
      <rect x="100" y="462" width="330" height="125" rx="20" fill="url(#framework)" stroke="#4c8bc8" stroke-width="1.5"/>
      <circle cx="135" cy="503" r="16" fill="#4ca6ff" opacity="0.95"/>
      <text x="165" y="511" class="card-title">MapperProxy</text>
      <text x="125" y="552" class="card-sub">识别 Mapper 方法并交给 MapperMethod</text>
    </g>

    <path d="M430 524 H520 V298 H555" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="445" y="507" class="small">namespace + id</text>

    <!-- Framework vertical flow -->
    <g filter="url(#shadow)">
      <rect x="570" y="248" width="610" height="100" rx="18" fill="url(#framework)" stroke="#407bb5" stroke-width="1.5"/>
      <rect x="590" y="269" width="42" height="42" rx="11" fill="#29669c"/>
      <text x="603" y="298" class="card-title" font-size="18">1</text>
      <text x="653" y="288" class="card-title">定位 MappedStatement</text>
      <text x="653" y="321" class="card-sub">statementId = namespace + methodId</text>
    </g>

    <path d="M875 348 V388" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="570" y="398" width="610" height="90" rx="18" fill="url(#framework)" stroke="#407bb5" stroke-width="1.5"/>
      <rect x="590" y="421" width="42" height="42" rx="11" fill="#29669c"/>
      <text x="603" y="450" class="card-title" font-size="18">2</text>
      <text x="653" y="450" class="card-title">SqlSession.selectOne(...)</text>
    </g>

    <path d="M875 488 V528" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="570" y="538" width="610" height="105" rx="18" fill="url(#cache)" stroke="#d89543" stroke-width="1.5"/>
      <rect x="590" y="563" width="42" height="42" rx="11" fill="#b96d25"/>
      <text x="603" y="592" class="card-title" font-size="18">3</text>
      <text x="653" y="579" class="card-title">CachingExecutor · 二级缓存</text>
      <text x="653" y="616" class="card-sub">按 CacheKey 查 Mapper namespace 级缓存</text>
    </g>

    <path d="M875 643 V683" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="895" y="670" class="label" fill="#ffbd69">未命中</text>

    <g filter="url(#shadow)">
      <rect x="570" y="693" width="610" height="105" rx="18" fill="url(#cache)" stroke="#d89543" stroke-width="1.5"/>
      <rect x="590" y="718" width="42" height="42" rx="11" fill="#b96d25"/>
      <text x="603" y="747" class="card-title" font-size="18">4</text>
      <text x="653" y="734" class="card-title">BaseExecutor · 一级缓存</text>
      <text x="653" y="771" class="card-sub">localCache：当前 SqlSession 内有效</text>
    </g>

    <path d="M875 798 V838" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="895" y="825" class="label" fill="#ffbd69">未命中</text>

    <g filter="url(#shadow)">
      <rect x="570" y="848" width="610" height="92" rx="18" fill="url(#query)" stroke="#2bbbc8" stroke-width="1.5"/>
      <rect x="590" y="873" width="42" height="42" rx="11" fill="#168c99"/>
      <text x="603" y="902" class="card-title" font-size="18">5</text>
      <text x="653" y="889" class="card-title">doQuery() · 真正访问数据库</text>
      <text x="653" y="921" class="card-sub">创建处理器 → 绑定参数 → 执行 SQL → 映射结果</text>
    </g>

    <!-- Return shortcuts -->
    <g filter="url(#shadow)">
      <rect x="1240" y="455" width="245" height="190" rx="22" fill="#102b35" stroke="#42c77a" stroke-width="1.5"/>
      <circle cx="1280" cy="500" r="18" fill="#2cad67"/>
      <path d="M1272 500 L1278 506 L1289 493" fill="none" stroke="#ecfff3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1312" y="508" class="card-title">命中缓存</text>
      <text x="1270" y="550" class="card-sub">跳过数据库查询</text>
      <text x="1270" y="582" class="card-sub">直接返回结果对象</text>
      <text x="1270" y="617" class="small">L2 或 L1 命中均可返回</text>
    </g>
    <path d="M1180 590 H1230" fill="none" stroke="#78e6a6" stroke-width="3" marker-end="url(#returnArrow)"/>
    <path d="M1180 745 H1210 Q1230 745 1230 725 V645" fill="none" stroke="#78e6a6" stroke-width="3" marker-end="url(#returnArrow)"/>
    <text x="1188" y="572" class="label" fill="#78e6a6">命中</text>
    <text x="1188" y="731" class="label" fill="#78e6a6">命中</text>

    <!-- Internal doQuery details -->
    <g>
      <rect x="1220" y="700" width="280" height="240" rx="22" fill="#0e2334" stroke="#2d7085" stroke-width="1.5"/>
      <text x="1250" y="740" class="card-title">JDBC 执行细节</text>
      <circle cx="1255" cy="782" r="14" fill="#1d92a4"/><text x="1250" y="788" class="small" fill="#fff">①</text>
      <text x="1280" y="788" class="step">StatementHandler</text>
      <circle cx="1255" cy="825" r="14" fill="#1d92a4"/><text x="1250" y="831" class="small" fill="#fff">②</text>
      <text x="1280" y="831" class="step">ParameterHandler</text>
      <circle cx="1255" cy="868" r="14" fill="#1d92a4"/><text x="1250" y="874" class="small" fill="#fff">③</text>
      <text x="1280" y="874" class="step">Statement 执行 SQL</text>
      <circle cx="1255" cy="911" r="14" fill="#1d92a4"/><text x="1250" y="917" class="small" fill="#fff">④</text>
      <text x="1280" y="917" class="step">ResultSetHandler</text>
    </g>
    <path d="M1180 894 H1210" fill="none" stroke="#62d9ff" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Return to business -->
    <path d="M1360 645 H1510 V980 H265 V600" fill="none" stroke="#78e6a6" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#returnArrow)"/>
    <path d="M1360 940 V980" fill="none" stroke="#78e6a6" stroke-width="3" stroke-dasharray="9 8"/>
    <rect x="585" y="956" width="620" height="48" rx="24" fill="#123525" stroke="#3aaa6b"/>
    <text x="895" y="987" text-anchor="middle" class="label" fill="#8ff0b5">映射为 Java 对象 → 写入缓存 → 返回业务代码</text>

    <!-- Notes -->
    <rect x="70" y="1018" width="1460" height="72" rx="18" fill="#0b1d32" stroke="#294565"/>
    <circle cx="105" cy="1054" r="16" fill="#315d8d"/>
    <text x="100" y="1060" class="label" fill="#e8f3ff">i</text>
    <text x="135" y="1048" class="note">一级缓存默认开启，作用域是 SqlSession；二级缓存必须显式启用，并以 Mapper namespace 为作用域。</text>
    <text x="135" y="1075" class="note">查询结果立即进入一级缓存；二级缓存通常在事务提交或 SqlSession 关闭后才对其他会话可见。</text>
  </g>
</svg>
